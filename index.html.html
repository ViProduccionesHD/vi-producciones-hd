<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VI Producciones HD | Redes oficiales</title>
<style>
:root{color-scheme:dark;--gold:#f4c76a;--gold2:#b8872d;--ink:#10131b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:#fff;background:radial-gradient(circle at top,#293044 0,#11141d 48%,#080a0f 100%);display:flex;align-items:center;justify-content:center;padding:24px}
main{width:min(100%,480px);text-align:center}
.logo{width:96px;height:96px;margin:0 auto 18px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;background:linear-gradient(145deg,#242a37,#0b0d12);box-shadow:0 0 28px #f4c76a25;color:var(--gold);font-weight:900;font-size:25px;letter-spacing:-2px}
.kicker{font-size:12px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin:0 0 8px}
h1{font-size:clamp(28px,7vw,40px);line-height:1.05;margin:0;font-weight:900}
h1 span{color:var(--gold)}
p{color:#c5cad4;line-height:1.5;margin:14px 0 26px}
.links{display:grid;gap:13px}
a{display:flex;align-items:center;gap:14px;text-decoration:none;color:white;padding:16px 18px;border-radius:15px;border:1px solid #ffffff20;background:#ffffff0b;text-align:left;transition:transform .15s,background .15s}
a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
a:hover{transform:translateY(-2px);background:#ffffff16}
.icon{width:43px;height:43px;border-radius:12px;display:grid;place-items:center;font-size:22px;font-weight:bold;flex:none}
.fb .icon{background:#1877f2}.tt .icon{background:#252525}.yt .icon{background:#ff0033}
.label{font-weight:800;font-size:16px}.sub{display:block;color:#b9bfca;font-size:12px;margin-top:4px}
.arrow{margin-left:auto;color:var(--gold);font-size:22px}
footer{margin-top:27px;color:#858c99;font-size:11px;letter-spacing:2px}
.note{font-size:12px;color:#aeb5c2;margin-top:18px}
</style>
</head>
<body>
<main>
  <div class="logo" aria-label="VI Producciones HD">VI<span style="color:#fff">HD</span></div>
  <p class="kicker">Producción • Eventos • Transmisiones</p>
  <h1>VI PRODUCCIONES <span>HD</span></h1>
  <p>¡Síguenos en nuestras redes oficiales y acompáñanos en cada evento!</p>
  <nav class="links" aria-label="Redes sociales oficiales">
    <a class="fb" href="https://www.facebook.com/profile.php?id=61571633758881" target="_blank" rel="noopener noreferrer">
      <span class="icon" aria-hidden="true">f</span><span><span class="label">Facebook</span><span class="sub">Síguenos en nuestra página</span></span><span class="arrow" aria-hidden="true">›</span>
    </a>
    <a class="tt" href="https://www.tiktok.com/@vi.prohd3" target="_blank" rel="noopener noreferrer">
      <span class="icon" aria-hidden="true">♪</span><span><span class="label">TikTok</span><span class="sub">@vi.prohd3</span></span><span class="arrow" aria-hidden="true">›</span>
    </a>
    <a class="yt" href="https://www.youtube.com/@ViproduccionesHD3" target="_blank" rel="noopener noreferrer">
      <span class="icon" aria-hidden="true">▶</span><span><span class="label">YouTube</span><span class="sub">VI Producciones HD</span></span><span class="arrow" aria-hidden="true">›</span>
    </a>
  </nav>
  <footer>GRACIAS POR APOYAR NUESTRO TRABAJO</footer>
  <div class="note">VI PRODUCCIONES HD · Redes oficiales</div>
</main>
</body>
</html>
